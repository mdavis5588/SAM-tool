<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Oracle SAM Admin{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .badge-metric-processor { background: #0d6efd; }
    .badge-metric-nup       { background: #6f42c1; }
    .table th { white-space: nowrap; }
    .status-active   { color: #198754; }
    .status-expired  { color: #dc3545; }
    .status-expiring { color: #fd7e14; }
  </style>
</head>
<body>

{% if session.logged_in %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('servers') }}">
      <i class="bi bi-shield-check"></i> Oracle SAM
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'servers' %}active{% endif %}"
             href="{{ url_for('servers') }}"><i class="bi bi-server"></i> Servers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['contracts','contract_detail'] %}active{% endif %}"
             href="{{ url_for('contracts') }}"><i class="bi bi-file-earmark-text"></i> Contracts</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'alerts' %}active{% endif %}"
             href="{{ url_for('alerts') }}"><i class="bi bi-exclamation-triangle"></i> Alerts</a>
        </li>
      </ul>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </div>
  </div>
</nav>
{% endif %}

<div class="container-fluid py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
