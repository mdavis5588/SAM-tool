 
Since you're already running 19c, stop hand-building JSON and let Oracle create valid JSON.
SELECT JSON_OBJECT(

    'nup_total_users' VALUE COUNT(*),

    'nup_active_users' VALUE NVL(

        SUM(CASE WHEN account_status='OPEN' THEN 1 END),0),

    'nup_locked_users' VALUE NVL(

        SUM(CASE WHEN account_status LIKE '%LOCKED%' THEN 1 END),0),

    'nup_sample_users' VALUE JSON_ARRAYAGG(username)

)

FROM (

    SELECT username, account_status

    FROM dba_users

    WHERE oracle_maintained = 'N'

       OR oracle_maintained IS NULL

    FETCH FIRST 50 ROWS ONLY

);
