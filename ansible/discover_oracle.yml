---
# =============================================================================
# Oracle SAM - Discovery Playbook
# Collects all data needed to calculate Oracle processor licence requirements:
#   - Server / OS metadata
#   - Physical CPU topology (sockets, cores per socket, processor model)
#   - Oracle database instances, editions and installed options
#   - Virtualisation information (VMware vCPU or bare-metal)
# Results are written into PostgreSQL via the sam_loader role.
# =============================================================================

- name: Oracle SAM discovery
  hosts: oracle_servers
  gather_facts: true        # populates ansible_processor_*, ansible_virtualization_*
  become: false             # run as oracle_discovery user; sudo only where needed
  serial: 10                # limit parallel connections

  vars:
    sam_run_id: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}-{{ inventory_hostname | hash('md5') | truncate(6, true, '') }}"
    sam_discovery_user: "sam_discovery"
    sam_discovery_password: "{{ vault_sam_discovery_password }}"
    oracle_base_paths:
      - /u01/app/oracle
      - /oracle
      - /opt/oracle
    oratab_paths:
      - /etc/oratab
      - /var/opt/oracle/oratab

  tasks:

    # ------------------------------------------------------------------
    # 1. SERVER METADATA
    # ------------------------------------------------------------------
    - name: Collect OS release details
      ansible.builtin.command: cat /etc/os-release
      register: os_release_raw
      changed_when: false
      ignore_errors: true

    - name: Collect system uptime
      ansible.builtin.command: uptime -p
      register: uptime_raw
      changed_when: false
      ignore_errors: true

    # ------------------------------------------------------------------
    # 2. CPU / PROCESSOR TOPOLOGY
    #    lscpu gives us the authoritative socket/core/thread picture.
    #    We also read /proc/cpuinfo for the exact model string which
    #    is needed to match the Oracle Processor Core Factor Table.
    # ------------------------------------------------------------------
    - name: Run lscpu for CPU topology
      ansible.builtin.command: lscpu --json
      register: lscpu_output
      changed_when: false
      ignore_errors: true

    - name: Read /proc/cpuinfo for processor model string
      ansible.builtin.slurp:
        src: /proc/cpuinfo
      register: cpuinfo_raw
      ignore_errors: true

    - name: Parse CPU topology from lscpu JSON
      ansible.builtin.set_fact:
        cpu_topology: "{{ lscpu_output.stdout | from_json }}"
      when: lscpu_output.rc == 0

    - name: Extract key CPU fields
      ansible.builtin.set_fact:
        sam_cpu_sockets:        "{{ (cpu_topology.lscpu | selectattr('field', 'equalto', 'Socket(s):') | map(attribute='data') | first | int) if cpu_topology is defined else ansible_processor_count }}"
        sam_cpu_cores_per_socket: "{{ (cpu_topology.lscpu | selectattr('field', 'equalto', 'Core(s) per socket:') | map(attribute='data') | first | int) if cpu_topology is defined else (ansible_processor_cores | default(1)) }}"
        sam_cpu_threads_per_core: "{{ (cpu_topology.lscpu | selectattr('field', 'equalto', 'Thread(s) per core:') | map(attribute='data') | first | int) if cpu_topology is defined else 1 }}"
        sam_cpu_architecture:   "{{ (cpu_topology.lscpu | selectattr('field', 'equalto', 'Architecture:') | map(attribute='data') | first) if cpu_topology is defined else ansible_architecture }}"
        sam_cpu_model:          "{{ ansible_processor[2] | default('Unknown') }}"
        sam_total_physical_cores: "{{ sam_cpu_sockets | int * sam_cpu_cores_per_socket | int }}"

    # ------------------------------------------------------------------
    # 3. VIRTUALISATION DETECTION
    #    Oracle requires you to track whether the host is bare-metal,
    #    a VMware VM (which can use soft-partitioning under VSPP),
    #    or another hypervisor (counts as all physical cores licensed).
    # ------------------------------------------------------------------
    - name: Detect virtualisation type
      ansible.builtin.set_fact:
        sam_virt_type: "{{ ansible_virtualization_type | default('physical') }}"
        sam_virt_role: "{{ ansible_virtualization_role | default('host') }}"

    - name: Check for VMware tools (confirms VMware VM)
      ansible.builtin.command: which vmware-toolsd
      register: vmware_tools_check
      changed_when: false
      ignore_errors: true

    - name: Set VMware flag
      ansible.builtin.set_fact:
        sam_is_vmware: "{{ vmware_tools_check.rc == 0 or sam_virt_type in ['VMware', 'vmware'] }}"

    # ------------------------------------------------------------------
    # 3b. EXADATA DETECTION
    #     Query gv$cell row count — returns rows only on real Exadata hardware.
    #     Fall back to cell_offload_processing parameter as secondary check.
    #     Runs against the first available Oracle instance on this host.
    # ------------------------------------------------------------------
    - name: Query gv$cell row count for Exadata detection
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
        WHENEVER SQLERROR CONTINUE
        SELECT COUNT(*) FROM gv$cell;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: exadata_cell_results
      no_log: true
      ignore_errors: true
      changed_when: false

    - name: Set Exadata flag
      ansible.builtin.set_fact:
        sam_is_exadata: >-
          {{
            exadata_cell_results.results | default([])
            | map(attribute='stdout') | map('trim') | map('int', default=0)
            | select('gt', 0) | list | length > 0
          }}

    # ------------------------------------------------------------------
    # 4. ORACLE INSTANCE DISCOVERY
    #    Parse oratab for all registered instances, then for each one
    #    connect to the database to get edition, version and options.
    # ------------------------------------------------------------------
    - name: Find oratab file
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ oratab_paths }}"
      register: oratab_stat

    - name: Read oratab
      ansible.builtin.slurp:
        src: "{{ item.stat.path }}"
      loop: "{{ oratab_stat.results | selectattr('stat.exists') | list }}"
      register: oratab_content
      when: item.stat.exists

    - name: Parse oratab entries
      ansible.builtin.set_fact:
        oracle_instances_raw: >-
          {{
            (oratab_content.results
              | selectattr('content', 'defined')
              | map(attribute='content')
              | map('b64decode')
              | join('\n')
            ).split('\n')
            | reject('match', '^\\s*#')
            | reject('match', '^\\s*$')
            | map('regex_findall', '^([^:]+):([^:]+):([YyNn])')
            | select
            | map('first')
            | list
          }}

    - name: Set instance list fact
      ansible.builtin.set_fact:
        sam_oracle_instances: >-
          {{
            oracle_instances_raw | map('zip', ['sid', 'oracle_home', 'autostart'])
            | map('community.general.dict')
            | list
          }}
      when: oracle_instances_raw is defined

    - name: Query each Oracle instance for edition and version
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
        SELECT
          '{"version":"'       || SUBSTR(i.version,1,20)                         || '",'  ||
          '"edition":"'        || SUBSTR(CASE
                                   WHEN UPPER(v.banner) LIKE '%ENTERPRISE%'          THEN 'Enterprise Edition'
                                   WHEN UPPER(v.banner) LIKE '%STANDARD EDITION 2%'  THEN 'Standard Edition 2'
                                   WHEN UPPER(v.banner) LIKE '%STANDARD%'            THEN 'Standard Edition'
                                   WHEN UPPER(v.banner) LIKE '%EXPRESS%'             THEN 'Express Edition'
                                   ELSE 'Unknown' END, 1, 60)                   || '",'  ||
          '"db_name":"'        || SUBSTR(d.name,1,30)                            || '",'  ||
          '"db_unique_name":"' || SUBSTR(d.db_unique_name,1,64)                  || '",'  ||
          '"is_cdb":"'         || d.cdb                                          || '",'  ||
          '"log_mode":"'       || d.log_mode                                     || '",'  ||
          '"created":"'        || TO_CHAR(d.created,'YYYY-MM-DD')                || '"}'
        FROM   v$instance i
        CROSS  JOIN v$database d
        CROSS  JOIN (SELECT banner FROM v$version
                     WHERE  UPPER(banner) LIKE '%ORACLE DATABASE%'
                     AND    ROWNUM = 1) v;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: sqlplus_results
      no_log: true
      ignore_errors: true
      changed_when: false

    - name: Query installed options per instance (dba_registry)
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
        SELECT '{"option":"' || comp_name || '","version":"' || version || '","status":"' || status || '"}'
        FROM   dba_registry
        WHERE  status IN ('VALID','OPTION OFF')
        ORDER BY comp_name;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: options_results
      no_log: true
      ignore_errors: true
      changed_when: false

    # ------------------------------------------------------------------
    # 5. EXTENDED DISCOVERY — feature usage, NUP users, PDBs, RAC nodes
    #    DBA_FEATURE_USAGE_STATISTICS replaces v$option — it records actual
    #    detected usage counts and dates, not just what is installed.
    # ------------------------------------------------------------------
    - name: Query DBA_FEATURE_USAGE_STATISTICS for licence-relevant feature usage
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
        SELECT '{"feature_name":"' || REPLACE(REPLACE(name,'\','\\'),'"','\"') ||
               '","db_version":"'  || SUBSTR(version,1,20) ||
               '","detected_usages":' || NVL(detected_usages,0) ||
               ',"total_samples":'    || NVL(total_samples,0) ||
               ',"currently_used":'   || CASE WHEN currently_used = 'TRUE' THEN 'true' ELSE 'false' END ||
               ',"first_usage_date":' || CASE WHEN first_usage_date IS NOT NULL
                                              THEN '"' || TO_CHAR(first_usage_date,'YYYY-MM-DD') || '"'
                                              ELSE 'null' END ||
               ',"last_usage_date":'  || CASE WHEN last_usage_date IS NOT NULL
                                              THEN '"' || TO_CHAR(last_usage_date,'YYYY-MM-DD') || '"'
                                              ELSE 'null' END || '}'
        FROM   dba_feature_usage_statistics
        WHERE  detected_usages > 0
          AND  name NOT IN (
               'ASO native encryption and checksumming',
               'Automatic Maintenance - SQL Tuning Advisor',
               'Automatic Maintenance - Space Advisor',
               'Automatic Segment Advisor',
               'Automatic SQL Tuning Advisor',
               'EM Performance Page',
               'File Mapping',
               'Label Security',
               'OLAP - Analytic Workspaces',
               'Oracle Secure Backup',
               'Real-Time SQL Monitoring',
               'SQL Access Advisor',
               'SQL Tuning Advisor',
               'SQL Tuning Set (user)',
               'Segment Advisor'
               )
        ORDER  BY name;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: feature_usage_results
      no_log: true
      ignore_errors: true
      changed_when: false

    - name: Query dba_users for Named User Plus counting
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
        SELECT
          '{"nup_total_users":' || COUNT(*) ||
          ',"nup_active_users":' || SUM(CASE WHEN account_status = 'OPEN' THEN 1 ELSE 0 END) ||
          ',"nup_locked_users":' || SUM(CASE WHEN account_status LIKE '%LOCKED%' THEN 1 ELSE 0 END) ||
          ',"nup_sample_users":' || '[' ||
            LISTAGG('"' || username || '"', ',') WITHIN GROUP (ORDER BY username) ||
          ']' || '}'
        FROM (
          SELECT username, account_status
          FROM   dba_users
          WHERE  oracle_maintained = 'N'
             OR  oracle_maintained IS NULL
          ORDER  BY username
          FETCH FIRST 50 ROWS ONLY
        );
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: nup_results
      no_log: true
      ignore_errors: true
      changed_when: false

    - name: Query v$pdbs for CDB/PDB topology with NUP counts and pack access (Oracle 12c+)
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF LONG 4000
        WHENEVER SQLERROR CONTINUE
        WITH pdb_params AS (
          SELECT con_id,
                 MAX(CASE WHEN LOWER(name) = 'control_management_pack_access'
                          THEN UPPER(SUBSTR(value,1,64)) END) AS mgmt_pack,
                 MAX(CASE WHEN LOWER(name) = 'enable_ddl_logging'
                          THEN UPPER(SUBSTR(value,1,10)) END) AS ddl_log
          FROM   gv$parameter
          WHERE  LOWER(name) IN ('control_management_pack_access','enable_ddl_logging')
            AND  inst_id = 1
          GROUP  BY con_id
        ),
        pdb_nup AS (
          SELECT con_id,
                 SUM(CASE WHEN account_status = 'OPEN' AND oracle_maintained = 'N' THEN 1 ELSE 0 END) AS nup_active,
                 SUM(CASE WHEN oracle_maintained = 'N' THEN 1 ELSE 0 END) AS nup_total
          FROM   cdb_users
          GROUP  BY con_id
        )
        SELECT '{"pdb_name":"'         || p.name              ||
               '","con_id":'           || p.con_id            ||
               ',"open_mode":"'        || p.open_mode         ||
               '","restricted":"'      || NVL(p.restricted,'NO') ||
               '","nup_active_users":' || NVL(n.nup_active,0) ||
               ',"nup_total_users":'   || NVL(n.nup_total,0)  ||
               ',"mgmt_pack_access":"' || NVL(pp.mgmt_pack,'NONE') ||
               '","diagnostics_licensed":' || CASE WHEN NVL(pp.mgmt_pack,'NONE') IN ('DIAGNOSTIC','DIAGNOSTIC+TUNING') THEN 'true' ELSE 'false' END ||
               ',"tuning_licensed":'   || CASE WHEN NVL(pp.mgmt_pack,'NONE') = 'DIAGNOSTIC+TUNING' THEN 'true' ELSE 'false' END ||
               ',"ddl_logging":'       || CASE WHEN NVL(pp.ddl_log,'FALSE') = 'TRUE' THEN 'true' ELSE 'false' END ||
               '}'
        FROM   v$pdbs p
        LEFT   JOIN pdb_params pp ON pp.con_id = p.con_id
        LEFT   JOIN pdb_nup n     ON n.con_id  = p.con_id
        ORDER  BY p.con_id;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: pdb_results
      no_log: true
      ignore_errors: true
      changed_when: false

    - name: Query gv$instance for RAC cluster nodes
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
        WHENEVER SQLERROR CONTINUE
        SELECT '{"node_name":"' || host_name || '","node_number":' || instance_number ||
               ',"instance_name":"' || instance_name || '"}'
        FROM   gv$instance
        ORDER  BY instance_number;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: rac_results
      no_log: true
      ignore_errors: true
      changed_when: false

    - name: Query GV$PARAMETER for management pack access per container
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
        WHENEVER SQLERROR CONTINUE
        SELECT '{"con_id":' || con_id ||
               ',"name":"'  || LOWER(name)         ||
               '","value":"'|| SUBSTR(value,1,256) || '"}'
        FROM   gv$parameter
        WHERE  LOWER(name) IN ('control_management_pack_access','enable_ddl_logging')
          AND  inst_id = 1
        ORDER  BY con_id, name;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: mgmt_pack_results
      no_log: true
      ignore_errors: true
      changed_when: false

    # ------------------------------------------------------------------
    # 5b. PRODUCT-LEVEL LICENCE USAGE — same MAP CTE logic as
    #     oracle_discovery_csv.sql _product_usage.csv output.
    #     Produces one row per licensed product with CURRENT_USAGE /
    #     PAST_USAGE / NO_USAGE so option detection matches the CSV path.
    # ------------------------------------------------------------------
    - name: Query product-level licence usage (MAP CTE, matches _product_usage.csv)
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF LONG 32767
        WHENEVER SQLERROR CONTINUE
        WITH
        map AS (
          SELECT '' product,'' feature,'' mversion,'' condition FROM dual UNION ALL
          SELECT 'Active Data Guard','Active Data Guard - Real-Time Query on Physical Standby','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Active Data Guard','Global Data Services','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Analytics','Data Mining','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Advanced Index Compression','^1[89]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Backup HIGH Compression','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Backup LOW Compression','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Backup MEDIUM Compression','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Backup ZLIB Compression','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Data Guard','^11\.2|^1[289]\.|^2[0-9]\.','C001' FROM dual UNION ALL
          SELECT 'Advanced Compression','HeapCompression','^12\.[2-9]|^1[89]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Heat Map','^12\.[2-9]|^1[89]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Hybrid Columnar Compression Row Level Locking','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Information Lifecycle Management','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Oracle Advanced Network Compression Service','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','Oracle Utility Datapump (Export)','^11\.2|^1[289]\.|^2[0-9]\.','C001' FROM dual UNION ALL
          SELECT 'Advanced Compression','Oracle Utility Datapump (Import)','^11\.2|^1[289]\.|^2[0-9]\.','C001' FROM dual UNION ALL
          SELECT 'Advanced Compression','SecureFile Compression (user)','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Compression','SecureFile Deduplication (user)','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Security','Data Redaction','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Security','Encrypted Tablespaces','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Security','Oracle Utility Datapump (Export)','^11\.2|^1[289]\.|^2[0-9]\.','C002' FROM dual UNION ALL
          SELECT 'Advanced Security','Oracle Utility Datapump (Import)','^11\.2|^1[289]\.|^2[0-9]\.','C002' FROM dual UNION ALL
          SELECT 'Advanced Security','SecureFile Encryption (user)','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Advanced Security','Transparent Data Encryption','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Database Vault','Oracle Database Vault','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Database Vault','Privilege Capture','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Diagnostics Pack','ADDM','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Diagnostics Pack','AWR Baseline','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Diagnostics Pack','AWR Baseline Template','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Diagnostics Pack','AWR Report','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Diagnostics Pack','Automatic Workload Repository','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Diagnostics Pack','Baseline Adaptive Thresholds','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Diagnostics Pack','Baseline Static Computations','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Diagnostics Pack','Diagnostic Pack','^11\.2', ' ' FROM dual UNION ALL
          SELECT 'Label Security','Label Security','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Multitenant','Oracle Multitenant','^1[28]\.','C003' FROM dual UNION ALL
          SELECT 'Multitenant','Oracle Multitenant','^1[9]\.|^2[0-9]\.','C005' FROM dual UNION ALL
          SELECT 'Multitenant','Oracle Pluggable Databases','^1[28]\.','C003' FROM dual UNION ALL
          SELECT 'OLAP','OLAP - Analytic Workspaces','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'OLAP','OLAP - Cubes','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Partitioning','Partitioning (user)','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Partitioning','Zone maps','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Real Application Clusters','Real Application Clusters (RAC)','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Spatial and Graph','Spatial','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Tuning Pack','Real-Time SQL Monitoring','^11\.2', ' ' FROM dual UNION ALL
          SELECT 'Tuning Pack','SQL Access Advisor','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Tuning Pack','SQL Monitoring and Tuning pages','^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Tuning Pack','SQL Profile','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Tuning Pack','SQL Tuning Advisor','^11\.2|^1[289]\.|^2[0-9]\.', ' ' FROM dual UNION ALL
          SELECT 'Tuning Pack','Tuning Pack','^11\.2', ' ' FROM dual UNION ALL
          SELECT '' product,'' feature,'' mversion,'' condition FROM dual
        ),
        fus AS (
          SELECT
            CASE
              WHEN dbid||'#'||version||'#'||TO_CHAR(last_sample_date,'YYYYMMDDHH24MISS') =
                   FIRST_VALUE(dbid)    OVER (ORDER BY last_sample_date DESC NULLS LAST, dbid DESC)||'#'||
                   FIRST_VALUE(version) OVER (ORDER BY last_sample_date DESC NULLS LAST, dbid DESC)||'#'||
                   FIRST_VALUE(TO_CHAR(last_sample_date,'YYYYMMDDHH24MISS'))
                                        OVER (ORDER BY last_sample_date DESC NULLS LAST, dbid DESC)
              THEN 'Y' ELSE 'N'
            END AS current_entry,
            name, last_sample_date, dbid, version,
            detected_usages, total_samples, currently_used,
            first_usage_date, last_usage_date, aux_count, feature_info
          FROM dba_feature_usage_statistics
        ),
        pfus AS (
          SELECT
            m.product,
            CASE
              WHEN m.condition = 'BUG'
                   THEN '3.SUPPRESSED_DUE_TO_BUG'
              WHEN f.detected_usages > 0
                   AND f.currently_used = 'TRUE'
                   AND f.current_entry  = 'Y'
                   AND (TRIM(m.condition) IS NULL
                        OR (CASE
                              WHEN m.condition = 'C001'
                                   AND (REGEXP_LIKE(TO_CHAR(f.feature_info),'compression[ -]used:[ 0-9]*[1-9][ 0-9]*time','i')
                                     OR REGEXP_LIKE(TO_CHAR(f.feature_info),'compression[ -]used: *TRUE','i'))
                                   THEN 'TRUE'
                              WHEN m.condition = 'C002'
                                   AND (REGEXP_LIKE(TO_CHAR(f.feature_info),'encryption used:[ 0-9]*[1-9][ 0-9]*time','i')
                                     OR REGEXP_LIKE(TO_CHAR(f.feature_info),'encryption used: *TRUE','i'))
                                   THEN 'TRUE'
                              WHEN m.condition = 'C003' AND f.aux_count > 1 THEN 'TRUE'
                              WHEN m.condition = 'C005' AND f.aux_count > 3 THEN 'TRUE'
                              WHEN m.condition = 'C004'                      THEN 'TRUE'
                              ELSE 'FALSE'
                            END) = 'TRUE')
                   THEN '6.CURRENT_USAGE'
              WHEN f.detected_usages > 0
                   THEN '4.PAST_USAGE'
              WHEN f.current_entry = 'Y'
                   THEN '2.NO_CURRENT_USAGE'
              ELSE '1.NO_PAST_USAGE'
            END AS usage
          FROM map m
          JOIN fus f ON m.feature = f.name AND REGEXP_LIKE(f.version, m.mversion)
          WHERE NVL(f.total_samples, 0) > 0
            AND NVL(m.condition, '-') NOT IN ('INVALID')
        )
        SELECT '{"product":"' || REPLACE(REPLACE(product,'\','\\'),'"','\"') ||
               '","usage_status":"' ||
               DECODE(MAX(usage),
                 '2.NO_CURRENT_USAGE', 'NO_USAGE',
                 '3.SUPPRESSED_DUE_TO_BUG', 'NO_USAGE',
                 '4.PAST_USAGE',       'PAST_USAGE',
                 '6.CURRENT_USAGE',    'CURRENT_USAGE',
                 'NO_USAGE') || '"}'
        FROM pfus
        WHERE usage IN ('2.NO_CURRENT_USAGE','4.PAST_USAGE','6.CURRENT_USAGE')
        GROUP BY product
        ORDER BY product;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: product_usage_results
      no_log: true
      ignore_errors: true
      changed_when: false

    - name: Query application PDB count for Multitenant licence check
      ansible.builtin.shell: |
        export ORACLE_HOME="{{ item.oracle_home }}"
        export ORACLE_SID="{{ item.sid }}"
        export PATH="$ORACLE_HOME/bin:$PATH"
        sqlplus -s {{ sam_discovery_user }}/{{ sam_discovery_password }} << 'EOF'
        SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
        WHENEVER SQLERROR CONTINUE
        SELECT COUNT(*) FROM v$pdbs
        WHERE  UPPER(name) NOT IN ('PDB$SEED','CDB$ROOT','AUDSYS')
          AND  con_id > 0;
        EXIT;
        EOF
      loop: "{{ sam_oracle_instances | default([]) }}"
      loop_control:
        label: "{{ item.sid }}"
      register: pdb_count_results
      no_log: true
      ignore_errors: true
      changed_when: false

    - name: Assemble extended instance data
      ansible.builtin.set_fact:
        sam_extended_instances: >-
          {{
            sam_oracle_instances | default([]) | map('combine', {}) | list
            | zip(
                nup_results.results         | map(attribute='stdout') | map('trim') | list,
                pdb_results.results         | map(attribute='stdout') | map('trim') | list,
                rac_results.results         | map(attribute='stdout') | map('trim') | list,
                feature_usage_results.results | map(attribute='stdout') | map('trim') | list,
                mgmt_pack_results.results   | map(attribute='stdout') | map('trim') | list
              )
            | list
          }}

    - name: Build extended instance payload list
      ansible.builtin.set_fact:
        sam_instances_extended: >-
          {{
            sam_instances_extended | default([]) + [{
              'sid': item.0.sid,
              'nup_total_users':  (item.1 | from_json).nup_total_users  | default(0),
              'nup_active_users': (item.1 | from_json).nup_active_users | default(0),
              'nup_locked_users': (item.1 | from_json).nup_locked_users | default(0),
              'nup_sample_users': (item.1 | from_json).nup_sample_users | default([]),
              'pdbs':          item.2.split('\n') | reject('equalto','') | map('from_json') | list,
              'rac_nodes':     item.3.split('\n') | reject('equalto','') | map('from_json') | list,
              'feature_usage': item.4.split('\n') | reject('equalto','') | map('from_json') | list,
              'db_parameters': item.5.split('\n') | reject('equalto','') | map('from_json') | list
            }]
          }}
      loop: "{{ sam_extended_instances | default([]) }}"
      when: sam_extended_instances is defined

    - name: Flatten db_parameters across all instances for options loading
      ansible.builtin.set_fact:
        sam_db_params: >-
          {{
            sam_instances_extended | default([])
            | map(attribute='db_parameters') | flatten
          }}
      when: sam_instances_extended is defined

    # ------------------------------------------------------------------
    # 6. ASSEMBLE FACT PAYLOAD
    # ------------------------------------------------------------------
    - name: Assemble SAM discovery payload
      ansible.builtin.set_fact:
        sam_payload:
          run_id:         "{{ sam_run_id }}"
          hostname:       "{{ inventory_hostname }}"
          fqdn:           "{{ ansible_fqdn }}"
          ip_address:     "{{ ansible_default_ipv4.address | default('') }}"
          os_family:      "{{ ansible_os_family }}"
          os_distribution: "{{ ansible_distribution }}"
          os_version:     "{{ ansible_distribution_version }}"
          environment:    "{{ sam_environment | default('unknown') }}"
          criticality:    "{{ sam_criticality | default('unknown') }}"
          cpu_sockets:    "{{ sam_cpu_sockets | int }}"
          cpu_cores_per_socket: "{{ sam_cpu_cores_per_socket | int }}"
          cpu_threads_per_core: "{{ sam_cpu_threads_per_core | int }}"
          total_physical_cores: "{{ sam_total_physical_cores | int }}"
          cpu_model:      "{{ sam_cpu_model }}"
          cpu_architecture: "{{ sam_cpu_architecture }}"
          virt_type:      "{{ sam_virt_type }}"
          virt_role:      "{{ sam_virt_role }}"
          is_vmware:      "{{ sam_is_vmware | bool }}"
          is_exadata:     "{{ sam_is_exadata | bool }}"
          total_ram_mb:   "{{ ansible_memtotal_mb | default(0) }}"
          discovered_at:  "{{ ansible_date_time.iso8601 }}"
          instances: >-
            {{
              sqlplus_results.results
              | selectattr('rc', 'equalto', 0)
              | map(attribute='stdout')
              | map('trim')
              | map('from_json')
              | list
            }}

    - name: Assemble SAM extended payload
      ansible.builtin.set_fact:
        sam_extended_payload:
          run_id:        "{{ sam_run_id }}"
          hostname:      "{{ inventory_hostname }}"
          instances:     "{{ sam_instances_extended | default([]) }}"
          db_parameters: "{{ sam_db_params | default([]) }}"

    # ------------------------------------------------------------------
    # 7. WRITE TO POSTGRESQL
    # ------------------------------------------------------------------
    - name: Load SAM payload into PostgreSQL
      community.postgresql.postgresql_query:
        db:       "{{ client_acme }}"
        login_host: "{{ PostgreSQL1 }}"
        login_port: "{{ 5432 }}"
        login_user: "{{ admin_user }}"
        login_password: "{{ admin }}"
        query: "SELECT sam.upsert_server_discovery(%(payload)s::jsonb)"
        named_args:
          payload: "{{ sam_payload | to_json }}"
      delegate_to: localhost
      ignore_errors: true

    - name: Load extended SAM payload into PostgreSQL (RAC, PDB, NUP)
      community.postgresql.postgresql_query:
        db:             "{{ sam_db_name }}"
        login_host:     "{{ sam_db_host }}"
        login_port:     "{{ sam_db_port }}"
        login_user:     "{{ sam_db_user }}"
        login_password: "{{ sam_db_password }}"
        query: "SELECT {{ sam_client_schema }}.upsert_oracle_extended_discovery(%(payload)s::jsonb)"
        named_args:
          payload: "{{ sam_extended_payload | to_json }}"
      delegate_to: localhost
      ignore_errors: true

    # ------------------------------------------------------------------
    # 7b. OPTION DETECTION — uses product_usage results (matches CSV/JSON
    #     upload path). Maps product names with CURRENT_USAGE to the
    #     oracle_options option_name values stored in the DB.
    #     Multitenant: flagged when >3 application PDBs exist (Oracle 21c
    #     free threshold), regardless of product_usage.
    # ------------------------------------------------------------------
    - name: Collect all product_usage rows across instances
      ansible.builtin.set_fact:
        sam_product_usage_rows: >-
          {{
            product_usage_results.results | default([])
            | map(attribute='stdout') | map('trim')
            | map('split', '\n') | flatten
            | reject('equalto', '')
            | map('from_json')
            | list
          }}

    - name: Collect max application PDB count across instances
      ansible.builtin.set_fact:
        sam_app_pdb_count: >-
          {{
            pdb_count_results.results | default([])
            | map(attribute='stdout') | map('trim')
            | reject('equalto', '')
            | map('int')
            | max | default(0)
          }}

    - name: Build licensed option list from product_usage (primary source)
      ansible.builtin.set_fact:
        sam_licensed_options: >-
          {{
            (sam_product_usage_rows
              | selectattr('usage_status', 'equalto', 'CURRENT_USAGE')
              | map(attribute='product') | map('lower') | list
            ) | map('regex_replace', '^.*$', '')
            | list
          }}
      # Reset; populated in the next task via a lookup map

    - name: Map product_usage CURRENT_USAGE products to oracle_options names
      ansible.builtin.set_fact:
        sam_licensed_options: >-
          {{
            sam_licensed_options | default([]) + [item.1]
          }}
      loop: >-
        {{
          [
            ['partitioning',                 'Partitioning'],
            ['real application clusters',    'Real Application Clusters (RAC)'],
            ['active data guard',            'Active Data Guard'],
            ['label security',               'Label Security'],
            ['database vault',               'Database Vault'],
            ['olap',                         'OLAP'],
            ['spatial and graph',            'Spatial and Graph'],
            ['advanced security',            'Advanced Security'],
            ['diagnostics pack',             'Diagnostics Pack'],
            ['tuning pack',                  'Tuning Pack'],
            ['data masking and subsetting',  'Data Masking and Subsetting'],
            ['advanced compression',         'Advanced Compression'],
            ['advanced analytics',           'Advanced Analytics'],
            ['multitenant',                  'Multitenant'],
          ]
        }}
      when: >-
        sam_product_usage_rows
        | selectattr('usage_status', 'equalto', 'CURRENT_USAGE')
        | selectattr('product', 'defined')
        | map(attribute='product') | map('lower')
        | select('search', item.0)
        | list | length > 0
        and item.1 not in sam_licensed_options | default([])
      vars:
        sam_licensed_options: "{{ sam_licensed_options | default([]) }}"

    - name: Add Multitenant if application PDB count exceeds free threshold (>3)
      ansible.builtin.set_fact:
        sam_licensed_options: "{{ sam_licensed_options | default([]) + ['Multitenant'] }}"
      when:
        - sam_app_pdb_count | int > 3
        - "'Multitenant' not in sam_licensed_options | default([])"

    # Clear all auto-detected options for this server's instances then re-insert,
    # so stale options from a previous upload do not persist.
    - name: Clear existing oracle_options for this server's instances
      community.postgresql.postgresql_query:
        db:             "{{ sam_db_name }}"
        login_host:     "{{ sam_db_host }}"
        login_port:     "{{ sam_db_port }}"
        login_user:     "{{ sam_db_user }}"
        login_password: "{{ sam_db_password }}"
        query: |
          DELETE FROM {{ sam_client_schema }}.oracle_options
          WHERE instance_id IN (
            SELECT i.instance_id
            FROM   {{ sam_client_schema }}.oracle_instances i
            JOIN   {{ sam_client_schema }}.oracle_servers   s ON s.server_id = i.server_id
            WHERE  s.hostname = %(hostname)s
          )
        named_args:
          hostname: "{{ inventory_hostname }}"
      delegate_to: localhost
      ignore_errors: true

    # Insert each licensed option for every instance on this server.
    - name: Insert licensed options into oracle_options
      community.postgresql.postgresql_query:
        db:             "{{ sam_db_name }}"
        login_host:     "{{ sam_db_host }}"
        login_port:     "{{ sam_db_port }}"
        login_user:     "{{ sam_db_user }}"
        login_password: "{{ sam_db_password }}"
        query: |
          INSERT INTO {{ sam_client_schema }}.oracle_options
              (instance_id, option_name, status, discovery_run_id)
          SELECT i.instance_id,
                 %(option_name)s,
                 'TRUE',
                 %(run_id)s
          FROM   {{ sam_client_schema }}.oracle_instances i
          JOIN   {{ sam_client_schema }}.oracle_servers   s ON s.server_id = i.server_id
          WHERE  s.hostname = %(hostname)s
        named_args:
          option_name: "{{ item }}"
          run_id:      "{{ sam_run_id }}"
          hostname:    "{{ inventory_hostname }}"
      loop: "{{ sam_licensed_options | default([]) }}"
      delegate_to: localhost
      ignore_errors: true
      when: sam_licensed_options | default([]) | length > 0

    - name: Print discovery summary
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }} —
          Sockets: {{ sam_cpu_sockets }},
          Cores/socket: {{ sam_cpu_cores_per_socket }},
          Total cores: {{ sam_total_physical_cores }},
          CPU: {{ sam_cpu_model }},
          Virt: {{ sam_virt_type }},
          Oracle instances: {{ sam_oracle_instances | default([]) | length }}
